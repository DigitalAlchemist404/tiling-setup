# tiling-setup: atajos del pomodoro y cronómetro para i3 (Mod = Super).
# Se incluye desde tu config con:  include ~/.config/i3/tiling-setup.conf
# (necesita i3 4.20 o más nuevo; si tu Mod no es Super, cambia Mod4 por tu tecla)
#
# Los escritorios (Mod+1..4), Mod+W (pestañas) y Mod+E (mosaico) ya vienen en i3.

set $timer $HOME/.local/share/tiling-setup/timer-core.sh

bindsym Mod4+p        exec --no-startup-id $timer pomo toggle
bindsym Mod4+Shift+p  exec --no-startup-id $timer pomo reset
bindsym Mod4+m        exec --no-startup-id $timer pomo cycle
bindsym Mod4+Shift+m  exec --no-startup-id $timer pomo custom
bindsym Mod4+x        exec --no-startup-id $timer pomo extend
bindsym Mod4+t        exec --no-startup-id $timer sw toggle
bindsym Mod4+Shift+t  exec --no-startup-id $timer sw reset
