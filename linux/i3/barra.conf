# Barra abajo con i3blocks. Reemplaza tu bloque bar { ... } actual por este.
bar {
    position bottom
    status_command i3blocks -c $HOME/.config/i3blocks/config
    colors {
        background #1a1b26
        statusline #c0caf5
        separator  #3b4261
        focused_workspace  #3b4261 #3b4261 #7dcfff
        active_workspace   #1a1b26 #1a1b26 #c0caf5
        inactive_workspace #1a1b26 #1a1b26 #7a84a8
        urgent_workspace   #f7768e #f7768e #1a1b26
    }
}
